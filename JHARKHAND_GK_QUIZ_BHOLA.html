.stat,.panel,.question{background:var(--panel);border:1px solid #304263;border-radius:15px;padding:14px}.stat{text-align:center}.stat b{display:block;font-size:22px;color:var(--accent)}

input,select,button{font:inherit;border-radius:10px;border:1px solid #405477;padding:12px;background:#0e1930;color:var(--text);min-width:0}
button{background:var(--accent);color:#1b1b1b;font-weight:800;border:0;cursor:pointer}button.secondary{background:#263858;color:white;border:1px solid #50688f}button:active{transform:scale(.98)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{flex:1}
.question{margin:10px 0}.qtop{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}.qtext{font-size:17px;font-weight:700;margin:10px 0}.answer{display:none;background:#102e2c;border-left:4px solid var(--green);padding:11px;border-radius:8px;color:#d8fff1;margin-top:8px}.answer.show{display:block}
.tag{font-size:12px;color:#ffe0a0;background:#48391c;padding:4px 8px;border-radius:20px}

</style></head>

const $=id=>document.getElementById(id);
$("total").textContent=questions.length;
const cats=[...new Set(questions.map(x=>x.category))];
cats.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;$("category").appendChild(o)});
function render(){
 const term=$("search").value.trim().toLowerCase(),cat=$("category").value;
 const rows=questions.filter(x=>(!cat||x.category===cat)&&(!term||(x.q+" "+x.a+" "+x.category).toLowerCase().includes(term)));
 $("shown").textContent=rows.length;
 $("list").innerHTML=rows.map(x=>`<article class="question"><div class="qtop"><span>प्रश्न ${x.id}</span><span class="tag">${x.category}</span></div><div class="qtext">${esc(x.q)}</div><button class="secondary" onclick="toggleAnswer(${x.id})">उत्तर देखें</button><div class="answer" id="a${x.id}"><b>उत्तर:</b> ${esc(x.a)}</div></article>`).join("")||'<div class="panel">कोई प्रश्न नहीं मिला।</div>';
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toggleAnswer(id){$("a"+id).classList.toggle("show")}
function showAll(){document.querySelectorAll(".answer").forEach(x=>x.classList.add("show"))}
function hideAll(){document.querySelectorAll(".answer").forEach(x=>x.classList.remove("show"))}
$("search").addEventListener("input",render);$("category").addEventListener("change",render);render();
let quiz=[],qi=0,points=0,locked=false;
function startQuiz(){
 quiz=[...questions].sort(()=>Math.random()-.5).slice(0,10);qi=0;points=0;
 $("score").textContent=points;$("quizArea").style.display="block";$("list").classList.add("hide");drawQuiz();window.scrollTo({top:0,behavior:"smooth"});
}
function drawQuiz(){
 locked=false;let x=quiz[qi];$("quizProgress").textContent=`प्रश्न ${qi+1}/10`;$("quizPoints").textContent="स्कोर: "+points;
 $("quizQuestion").textContent=x.q;$("quizFeedback").textContent="";$("nextBtn").classList.add("hide");
 let opts=[x.a,...[...new Set(questions.filter(y=>y.id!==x.id&&y.category===x.category).map(y=>y.a))].sort(()=>Math.random()-.5).slice(0,3)];
 while(opts.length<4)opts.push("इनमें से कोई नहीं");
 opts=opts.sort(()=>Math.random()-.5);
 $("quizOptions").innerHTML=opts.map((a,i)=>`<button class="option" onclick="answerQuiz(this,${JSON.stringify(a).replace(/"/g,'&quot;')},${JSON.stringify(x.a).replace(/"/g,'&quot;')})">${"ABCD"[i]}. ${esc(a)}</button>`).join("");
}
function answerQuiz(btn,choice,correct){
 if(locked)return;locked=true;
 document.querySelectorAll("#quizOptions button").forEach(b=>{b.disabled=true;if(b.textContent.slice(3).trim()===correct)b.classList.add("correct")});
 if(choice===correct){points++;$("quizFeedback").textContent="शाबाश! सही उत्तर।";}else{$("quizFeedback").textContent="सही उत्तर: "+correct;}
 $("score").textContent=points;$("quizPoints").textContent="स्कोर: "+points;$("nextBtn").classList.remove("hide");$("nextBtn").textContent=qi===9?"परिणाम देखें":"अगला प्रश्न →";
}
function nextQuestion(){if(qi<9){qi++;drawQuiz()}else{$("quizQuestion").textContent=`क्विज़ पूरा! आपका स्कोर ${points}/10 है।`;$("quizOptions").innerHTML="";$("quizFeedback").textContent=points>=8?"बहुत बढ़िया! झारखंड GK पर अच्छी पकड़ है।":"अच्छा प्रयास! प्रश्न बैंक से दोबारा अभ्यास करें।";$("nextBtn").classList.add("hide")}}
function endQuiz(){$("quizArea").style.display="none";$("list").classList.remove("hide")}
</script></body></html>
